services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      SOURCE_DIR: /data/sample/source
      OUTPUT_ROOT: /data/outputs
      # CHUNK_BYTES: "4194304"        # copy chunk size, default 4 MiB
      # RESHARD_SYNC: "false"         # "true" runs jobs inline (debug/tests)
    volumes:
      - ./sample:/data/sample:ro          # read-only sample checkpoints
                                          # (source/ step 7459, ckpt-8000/, ckpt-8200/)
      - ./outputs:/data/outputs           # resharded shards + job/run state
    restart: unless-stopped
